name: CI

on:
  push:
    branches:
      - prod
      - dev
    tags:
      - "v*"
  pull_request:
    branches:
      - prod
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang clang-format clang-tidy nodejs

      - name: Verify system tools
        run: |
          for tool in clang clang-format clang-tidy node; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::$tool is not on PATH after apt-get install"
              exit 1
            fi
            echo "$tool: $($tool --version 2>&1 | head -n1)"
          done

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build native PoW solver
        run: clang -O3 -pthread -funroll-loops -flto -march=native -mtune=native -o danyapi/deepseek/pow_solver danyapi/deepseek/pow_solver.c

      - name: Run tests
        run: python tests.py -j 2 --full

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/prod' || startsWith(github.ref, 'refs/tags/v'))
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=match,pattern=v(\d+\.\d+(\.\d+)?),group=1
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/prod' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/prod' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        run: |
          set -euo pipefail
          tag="$(printf '%s' '${{ steps.meta.outputs.tags }}' | head -n1)"
          name="danyapi-smoke-${{ github.run_id }}"
          docker run -d --name "$name" -p 8000:8000 \
            -e BYOK_MODE=1 \
            -e DANYAPI_LOG_LEVEL=INFO \
            "$tag"
          trap 'docker logs "$name" || true; docker rm -f "$name" || true' EXIT
          for attempt in $(seq 1 30); do
            if ! docker inspect -f '{{.State.Running}}' "$name" 2>/dev/null | grep -q true; then
              echo "::error::the container exited before /health answered"
              exit 1
            fi
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              echo "health endpoint answered"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the image did not answer on /health"
          exit 1
