name: Release

on:
  push:
    branches:
      - prod

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check skip
        id: skip
        run: |
          MSG=$(git log -1 --pretty=%B)
          if echo "$MSG" | grep -qi '\[skip release\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine next tag
        id: version
        if: steps.skip.outputs.skip == 'false'
        run: |
          LAST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          if [ -z "$LAST_TAG" ]; then
            NEXT_TAG="v0.0.1"
          else
            VERSION="${LAST_TAG#v}"
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            NEXT_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "next_tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        if: steps.skip.outputs.skip == 'false'
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            LOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "## What's Changed"
            echo ""
            echo "$LOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify the build on this commit
        if: steps.skip.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            runs=$(gh run list --repo "${{ github.repository }}" --workflow ci.yml --commit "$SHA" \
              --json status,conclusion --jq '.[] | "\(.status) \(.conclusion)"' || true)
            if [ -z "$runs" ]; then
              echo "waiting for the CI run to appear, attempt $attempt"
              sleep 15
              continue
            fi
            pending=$(printf '%s\n' "$runs" | grep -c '^in_progress\|^queued' || true)
            succeeded=$(printf '%s\n' "$runs" | grep -c '^completed success' || true)
            other=$(printf '%s\n' "$runs" | grep -vc '^completed success\|^in_progress\|^queued' || true)
            if [ "$other" -gt 0 ]; then
              echo "::error::CI did not succeed on this commit"
              printf '%s\n' "$runs"
              exit 1
            fi
            if [ "$pending" -eq 0 ] && [ "$succeeded" -ge 1 ]; then
              echo "CI succeeded on this commit"
              printf '%s\n' "$runs"
              exit 0
            fi
            echo "waiting for CI on this commit, attempt $attempt"
            printf '%s\n' "$runs"
            sleep 15
          done
          echo "::error::CI did not report success on this commit in time"
          exit 1

      - name: Create GitHub Release
        if: steps.skip.outputs.skip == 'false'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.version.outputs.next_tag }}
          generate_release_notes: false
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
