# DanyAPI - Fly.io конфигурация
# Внутренний порт 8080 (совпадает с PORT, на который слушает uvicorn).

app = "danyapi"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DANYAPI_PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
