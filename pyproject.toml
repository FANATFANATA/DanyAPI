[tool.ruff]
line-length = 160
target-version = "py313"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "FURB", "I", "PLW", "RUF", "UP"]
ignore = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated.*"]
