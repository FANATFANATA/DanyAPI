[tool.bandit]
exclude_dirs = ["tests", "docs", "web"]

[tool.bandit.shell_injection]
subprocess = [
    "subprocess.Popen",
    "subprocess.call",
    "subprocess.run",
    "subprocess.check_call",
    "subprocess.check_output",
]
shell = [
    "os.system",
    "os.popen",
    "popen2.Popen2",
    "popen2.Popen3",
    "popen2.Popen4",
]
no_shell = [
    "os.spawn",
    "os.spawnp",
    "os.spawnl",
    "os.spawnle",
    "os.spawnlp",
    "os.spawnlpe",
    "os.spawnv",
    "os.spawnve",
    "os.spawnvp",
    "os.spawnvpe",
    "os.posix_spawn",
    "os.posix_spawnp",
]
