[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "danyapi"
version = "0.1.0"
description = "OpenAI-compatible API proxy for DeepSeek and Qwen"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic",
    "python-dotenv",
    "pillow",
]

[tool.setuptools.packages.find]
include = ["danyapi*"]
exclude = ["web*", "docs*", "tests*"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "FURB", "I", "PLW", "RUF", "UP"]
ignore = ["PLW0603"]

[tool.ruff.lint.per-file-ignores]
"danyapi/byok/*" = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated.*"]
markers = [
    "live: tests that hit the real DeepSeek API (requires DEEPSEEK_TOKENS env var)",
]

[tool.mypy]
python_version = "3.12"

[tool.pyright]
include = ["danyapi", "docs", "tests"]
typeCheckingMode = "basic"

[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportGeneralTypeIssues = false
reportArgumentType = false
reportAttributeAccessIssue = false
reportOptionalMemberAccess = false

[tool.vulture]
min_confidence = 90
paths = ["danyapi", "docs"]

[tool.isort]
profile = "black"
line_length = 160
known_first_party = ["danyapi"]
